name: Import Quaternius avatar assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-quaternius-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Quaternius Universal Base Characters
        run: |
          set -euo pipefail
          mkdir -p assets/quaternius
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/glanderness/BeefTV/35a3749e21aeb11132f080c28b5b32a66af482cd/web/public/canvas/models/quaternius-standard-male.glb" \
            -o assets/quaternius/male.glb
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/glanderness/BeefTV/35a3749e21aeb11132f080c28b5b32a66af482cd/web/public/canvas/models/quaternius-standard-female.glb" \
            -o assets/quaternius/female.glb
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/glanderness/BeefTV/35a3749e21aeb11132f080c28b5b32a66af482cd/web/public/canvas/models/quaternius-standard-male.LICENSE.md" \
            -o assets/quaternius/MALE-LICENSE.md
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/glanderness/BeefTV/35a3749e21aeb11132f080c28b5b32a66af482cd/web/public/canvas/models/quaternius-standard-female.LICENSE.md" \
            -o assets/quaternius/FEMALE-LICENSE.md

          cat > assets/quaternius/README.md <<'EOF'
          # Quaternius Universal Base Characters

          These avatar files come from the free **Universal Base Characters — Standard** pack by Quaternius and are distributed under **CC0 1.0 Universal**.

          Original pack: https://quaternius.com/packs/universalbasecharacters.html

          The `.glb` files used here are browser-ready conversions of the original Standard-pack full-body male/female glTF models, sourced from the public BeefTV repository. The model geometry remains Quaternius artwork; runtime coloring is applied by this app.

          Files:
          - `male.glb` — Quaternius Standard male full-body avatar
          - `female.glb` — Quaternius Standard female full-body avatar
          EOF

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/quaternius
          if git diff --cached --quiet; then
            echo "Assets already current."
            exit 0
          fi
          git commit -m "Add Quaternius Universal Base Character assets"
          git push
